name: CI

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & E2E Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium with dependencies
        run: npx playwright install --with-deps chromium

      - name: Verify deterministic terrain artifacts (offline)
        run: npm run generate-glb && git diff --exit-code public/assets/whistler-peak.glb public/assets/terrain/whistler-terrain.json public/assets/terrain/whistler-dem.bin

      - name: Build project
        run: npm run build

      - name: Check for Node-only terrain source leak in browser bundle
        run: |
          if grep -R -E "node:https|elevation-tiles-prod|terrarium" dist/assets/*.js; then
            echo "ERROR: Node-only terrain source leaked into browser bundle"
            exit 1
          fi

      - name: Run unit and integration tests
        run: npm test

      - name: Run Playwright E2E browser tests
        run: npm run test:e2e

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Upload dist build artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist/
          if-no-files-found: ignore

      - name: Upload Playwright report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
